name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - product/mvp-foundation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Temporary workaround for npm Arborist `edgesOut` peer-resolution crash.
      # Remove once a committed lockfile makes installs deterministic.
      - name: Install
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
